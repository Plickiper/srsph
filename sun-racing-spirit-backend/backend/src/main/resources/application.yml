
server:
  port: 8080
  max-http-header-size: 5MB
  tomcat:
    max-http-post-size: 5MB
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/sun_racing_spirit_db?allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&useSSL=false
    username: root
    password: ***
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    hibernate:
      naming:
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      ddl-auto: update
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2KB
      max-file-size: 200MB
      max-request-size: 215MB
  http:
    multipart:
      enabled: true
      location: upload
file:
  upload:
    location: ..\\upload-dir
logging:
  level:
    com:
      pecenio:
        backend: INFO
        businessmodel: INFO
        datamodel: INFO