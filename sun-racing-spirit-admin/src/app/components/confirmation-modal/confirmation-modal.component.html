<div class="modal-overlay" 
     *ngIf="isVisible" 
     (click)="onBackdropClick($event)"
     [class.visible]="isVisible">
  <div class="modal-container">
    <div class="modal-header">
      <h3 class="modal-title">{{ title }}</h3>
      <button class="close-btn" (click)="onClose()" [disabled]="isLoading">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    
    <div class="modal-body">
      <div class="icon-container" [ngClass]="'icon-' + type">
        <svg *ngIf="type === 'warning'" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        <svg *ngIf="type === 'danger'" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="15" y1="9" x2="9" y2="15"></line>
          <line x1="9" y1="9" x2="15" y2="15"></line>
        </svg>
        <svg *ngIf="type === 'info'" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
      </div>
      <p class="modal-message">{{ message }}</p>
    </div>
    
    <div class="modal-footer">
      <button class="btn btn-secondary" 
              (click)="onCancel()" 
              [disabled]="isLoading">
        {{ cancelText }}
      </button>
      <button class="btn btn-primary" 
              [ngClass]="'btn-' + type"
              (click)="onConfirm()" 
              [disabled]="isLoading">
        <span *ngIf="!isLoading">{{ confirmText }}</span>
        <span *ngIf="isLoading" class="loading-spinner">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12a9 9 0 11-6.219-8.56"></path>
          </svg>
          Processing...
        </span>
      </button>
    </div>
  </div>
</div>
